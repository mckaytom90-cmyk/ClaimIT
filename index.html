function profile(){screen.innerHTML='<h2>My profile</h2><p>Optional details stored only in this browser. These do not automatically establish entitlement.</p><label>Nation<select id="pn">'+['England','Wales','Scotland','Northern Ireland'].map(n=>'<option '+(s.profile.nation===n?'selected':'')+'>'+n+'</option>').join('')+'</select></label>'+[['age','Age'],['adults','Adults in household'],['children','Children in household'],['income','Annual household gross income (£)']].map(([k,n])=>'<label>'+n+'<input type="number" min="0" id="p'+k+'" value="'+(Number.isFinite(s.profile[k])?s.profile[k]:'')+'"></label>').join('')+'<button onclick="saveProfile()">Save profile</button><button class="secondary" onclick="page(\'check\')">Update circumstances</button>'}
function saveProfile(){s.profile.nation=$('pn').value;['age','adults','children','income'].forEach(k=>{let v=$('p'+k).value;s.profile[k]=v===''?null:Math.max(0,Number(v))});save();page('home')}
function assess(id){let d=find(id),r=rules[id],a=s.assessments[id]||{},t=assessmentState(id);screen.innerHTML='<h2>'+d.name+'</h2><article><b>'+t.label+'</b>'+(t.value!==null?'<h2>'+money(t.value)+'</h2><small>Illustration only; period depends on scheme (annual council tax, quarterly childcare, per journey rail).</small>':'')+'</article>'+(r?r.q.map(([k,q,type])=>'<label>'+q+(type==='number'?'<input id="a'+k+'" type="number" min="0" value="'+(Number.isFinite(Number(a[k]))&&a[k]!==undefined?a[k]:'')+'">':'<select id="a'+k+'">'+['unknown','yes','no'].map(v=>'<option value="'+v+'" '+(a[k]===v?'selected':'')+'>'+({unknown:'Not sure',yes:'Yes',no:'No'}[v])+'</option>').join('')+'</select>')+'</label>').join('')+'<button onclick="saveAssessment(\''+id+'\')">Check my answers</button>':'<p>Detailed screening is not yet available for this scheme.</p>')+'<article><h3>How to claim</h3><ol>'+(r?r.steps:['Read the current guidance','Check eligibility and gather required evidence','Follow the official application route']).map(x=>'<li>'+x+'</li>').join('')+'</ol><a href="'+d.url+'" target="_blank" rel="noopener">Open guidance</a></article><button onclick="add(\''+id+'\')">Track claim</button><button class="secondary" onclick="page(\'discover\')">Back</button><p><small>Screening rules are preliminary and not independently verified. No eligibility guarantee.</small></p>'}
function saveAssessment(id){let a={};rules[id].q.forEach(([k,q,type])=>{let v=$('a'+k).value;a[k]=type==='number'?(v===''?'':Math.max(0,Number(v)||0)):v});s.assessments[id]=a;save();assess(id)}
function deadlines(){let today=new Date();let local=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');screen.innerHTML='<h2>Claim deadlines</h2><p>Enter deadlines confirmed by the provider. This is an in-app tracker, not a notification service.</p>'+Object.entries(s.claims).filter(([id])=>find(id)).sort((a,b)=>(a[1].deadline||'9999').localeCompare(b[1].deadline||'9999')).map(([id,c])=>'<article><h3>'+find(id).name+'</h3><p>'+(c.status==='Received'?'Received':c.deadline&&c.deadline<local?'Deadline passed — check provider':c.deadline?'Deadline: '+c.deadline:'No deadline set')+'</p><label>Confirmed deadline<input type="date" value="'+(/^\d{4}-\d{2}-\d{2}$/.test(c.deadline||'')?c.deadline:'')+'" onchange="setDeadline(\''+id+'\',this.value)"></label></article>').join('')+'<button onclick="page(\'tracker\')">Back to claims</button>'}
function setDeadline(id,v){s.claims[id].deadline=v;save();deadlines()}


const previousPage=page;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
page=function(p){previousPage(p);if(p==='home'){screen.innerHTML='<section class="newhero"><small>MORE MONEY. LESS EFFORT.</small><h1>Put money back in your pocket.</h1><p>Discover support, refunds and savings you might have missed.</p><button onclick="live()">Explore latest updates →</button></section><div class="quick"><button onclick="page(\'check\')">Find my money</button><button onclick="profile()">My profile</button><button onclick="page(\'tracker\')">My claims</button><button onclick="deadlines()">Deadlines</button></div>'+screen.innerHTML.replace('PocketBack v0.5','PocketBack v0.5')}if(p==='discover')screen.insertAdjacentHTML('afterbegin','<button onclick="live()">Latest official updates →</button>')};
let feedCache=[];s.seenFeed??=[];s.savedFeed??=[];
function live(){screen.innerHTML='<h2>Latest official updates</h2><p>Search GOV.UK for recent support announcements. These are discovery leads, not verified claims.</p><input id="postcode" placeholder="UK postcode (optional)" value="'+esc(s.profile.postcode||'')+'"><button onclick="localCouncil()">Find my council</button><button onclick="refreshFeed()">Refresh updates</button><button class="secondary" onclick="showFeed(true)">Saved updates</button><div id="feedstatus" role="status"></div><div id="feedlist"></div>';showFeed(false);if(!feedCache.length)refreshFeed()}
function localCouncil(){let p=$('postcode').value.trim();if(!p){$('feedstatus').textContent='Enter a postcode first.';return}s.profile.postcode=p;save();window.open('https://www.gov.uk/find-local-council','_blank','noopener');$('feedstatus').textContent='Enter your postcode on GOV.UK to find your council and its local support.'}
async function refreshFeed(){let status=$('feedstatus');status.textContent='Checking GOV.UK…';let terms=['financial support grant household','benefits payment support','energy bill support','tax refund'];let results=await Promise.allSettled(terms.map(async q=>{let u=new URL('https://www.gov.uk/api/search.json');u.search=new URLSearchParams({q,count:'20',order:'-public_timestamp',fields:'title,link,description,public_timestamp'});let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('Source unavailable');return (await r.json()).results||[]}));if(!$('feedlist')||$('feedstatus')!==status)return;let ok=results.filter(x=>x.status==='fulfilled');if(!ok.length){status.textContent='Live source unavailable in this browser. Try again later or use the official search link.';$('feedlist').innerHTML='<a href="https://www.gov.uk/search/all?keywords=financial+support" target="_blank" rel="noopener">Search GOV.UK directly</a>';return}let map=new Map();ok.flatMap(x=>x.value).forEach(x=>{if(typeof x.link==='string'&&/^\/[a-z0-9]/i.test(x.link)&&!x.link.startsWith('//'))map.set(x.link,{id:x.link,title:x.title,description:x.description,date:x.public_timestamp})});feedCache=[...map.values()].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));status.textContent=feedCache.length+' unique results • '+(ok.length<terms.length?'Some searches unavailable • ':'')+'Checked '+new Date().toLocaleTimeString('en-GB');showFeed(false)}
function showFeed(saved){let list=$('feedlist');if(!list)return;let rows=saved?s.savedFeed:feedCache.filter(x=>!s.seenFeed.includes(x.id));list.innerHTML=rows.length?rows.map((x,i)=>'<article><div class="tag">GOV.UK · '+esc(x.date?String(x.date).slice(0,10):'Date unavailable')+'</div><h3>'+esc(x.title)+'</h3><p>'+esc(x.description)+'</p><a target="_blank" rel="noopener" href="'+esc('https://www.gov.uk'+x.id)+'">Read official update</a>'+(!saved?'<p><button onclick="saveFeed('+i+')">Save</button><button class="secondary" onclick="dismissFeed('+i+')">Dismiss</button></p>':'')+'</article>').join(''):'<p>No '+(saved?'saved':'unseen')+' updates to display.</p>';window.currentFeedRows=rows}
function saveFeed(i){let x=window.currentFeedRows[i];if(!s.savedFeed.some(y=>y.id===x.id))s.savedFeed.push(x);s.seenFeed.push(x.id);save();showFeed(false)}
function dismissFeed(i){s.seenFeed.push(window.currentFeedRows[i].id);save();showFeed(false)}


const pocketPage=page;
page=function(p){pocketPage(p);if(p==='home')screen.insertAdjacentHTML('afterbegin','<article><div class="tag">NEW · MONEY RECOVERY</div><h2>Find missed refunds</h2><p>Check an email or receipt for potential refund and compensation opportunities.</p><button onclick="inbox()">Scan a message</button></article>')};
const patterns=[
{title:'Flight disruption',id:'flight',re:/flight|airline|boarding pass/i,signal:/cancel|delay|denied boarding/i,tip:'Check route, arrival delay, reason and airline.'},
{title:'Train disruption',id:'train',re:/train|railway|rail ticket|national rail/i,signal:/cancel|delay/i,tip:'Check ticket, operator and Delay Repay deadline.'},
{title:'Broadband outage',id:'broadband',re:/broadband|internet service/i,signal:/outage|fault|loss of service|missed appointment/i,tip:'Check provider participation and outage duration.'},
{title:'Energy credit',id:'energy',re:/energy|electricity|gas bill/i,signal:/credit balance|overpaid|refund/i,tip:'Check your account balance and supplier refund policy.'},
{title:'Purchase refund',id:'goods',re:/order|purchase|item|parcel/i,signal:/faulty|damaged|not delivered|refund|cancelled/i,tip:'Check seller, purchase date and refund rights.'},
{title:'Power interruption',id:'power',re:/electricity|power cut|power supply/i,signal:/outage|interruption|power cut/i,tip:'Check network operator and applicable compensation rules.'}
];
function inbox(){screen.innerHTML='<h2>Money recovery scanner</h2><article><p>Paste the relevant text from an email or receipt. Remove names, account numbers and other unnecessary personal details.</p><textarea id="message" rows="9" placeholder="Paste message here"></textarea><button onclick="scanMessage()">Find potential claims</button><button class="secondary" onclick="document.getElementById(\'message\').value=\'\';document.getElementById(\'scanresults\').innerHTML=\'\'">Clear</button></article><div id="scanresults"></div><p><small>Runs locally using keyword matching. No email connection, upload, AI service or automatic submission. Message text is not saved by this feature.</small></p>'}
function scanMessage(){let t=$('message').value;let hits=patterns.filter(p=>p.re.test(t)&&p.signal.test(t));$('scanresults').innerHTML=hits.length?'<h2>'+hits.length+' potential leads</h2>'+hits.map(p=>'<article><div class="tag">POSSIBLE MATCH · NOT VERIFIED</div><h3>'+p.title+'</h3><p>'+p.tip+'</p><button onclick="assess(\''+p.id+'\')">Check eligibility</button><button class="secondary" onclick="add(\''+p.id+'\')">Track</button></article>').join(''):'<article>No matching signals found. This does not mean you are ineligible for a refund.</article>'}

page('home');</script></html>
