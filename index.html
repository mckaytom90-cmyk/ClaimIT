ility","https://www.gov.uk/financial-help-disabled/vehicles-and-transport"],["taxrefund","work","Income tax refund","Tax","https://www.gov.uk/claim-tax-refund"],["mileage","work","Business mileage tax relief","Tax","https://www.gov.uk/tax-relief-for-employees/vehicles-you-use-for-work"],["fees","work","Professional subscription tax relief","Tax","https://www.gov.uk/tax-relief-for-employees/professional-fees-and-subscriptions"],["tools","work","Tools and equipment tax relief","Tax","https://www.gov.uk/tax-relief-for-employees/uniforms-work-clothing-and-tools"],["blind","disabled","Blind Person's Allowance","Tax","https://www.gov.uk/blind-persons-allowance"],["rent","low","Discretionary Housing Payment","Housing","https://www.gov.uk/government/publications/claiming-discretionary-housing-payments"],["smi","low","Support for Mortgage Interest (loan)","Housing","https://www.gov.uk/support-for-mortgage-interest"],["help","low","Help to Save","Savings","https://www.gov.uk/get-help-savings-low-income"],["lisa","young","Lifetime ISA bonus","Savings","https://www.gov.uk/lifetime-isa"],["tv","older","Free TV licence for eligible over-75s","Household","https://www.tvlicensing.co.uk/"],["water","low","WaterSure and social tariffs","Household","https://www.ccw.org.uk/"],["social","low","Broadband social tariffs","Household","https://www.ofcom.org.uk/phones-and-broadband/saving-money/social-tariffs/"],["goods","purchase","Faulty goods refund","Refunds","https://www.gov.uk/accepting-returns-and-giving-refunds"],["section75","purchase","Credit card Section 75 protection","Refunds","https://www.moneyhelper.org.uk/"],["chargeback","purchase","Card chargeback","Refunds","https://www.moneyhelper.org.uk/"],["power","utility","Power cut compensation","Energy","https://www.ofgem.gov.uk/"],["energy","utility","Energy credit refund","Energy","https://www.ofgem.gov.uk/"],["switch","utility","Energy switching compensation","Energy","https://www.ofgem.gov.uk/"],["waterout","utility","Water service compensation","Household","https://www.ccw.org.uk/"],["bus","travel","Bus or coach passenger rights","Travel","https://www.gov.uk/"],["ferry","travel","Ferry passenger rights","Travel","https://www.gov.uk/"],["passport","travel","Travel insurance claim","Travel","https://www.moneyhelper.org.uk/"],["redundancy","job","Statutory redundancy pay","Employment","https://www.gov.uk/redundancy-your-rights"],["holiday","work","Unpaid holiday pay","Employment","https://www.acas.org.uk/"],["wage","work","Minimum wage arrears","Employment","https://www.gov.uk/national-minimum-wage"],["sick","work","Statutory Sick Pay","Employment","https://www.gov.uk/statutory-sick-pay"],["paternity","baby","Statutory Paternity Pay","Family","https://www.gov.uk/paternity-pay-leave"],["adoption","baby","Statutory Adoption Pay","Family","https://www.gov.uk/adoption-pay-leave"],["shared","baby","Shared Parental Pay","Family","https://www.gov.uk/shared-parental-leave-and-pay"],["maintenance","child","Child maintenance","Family","https://www.gov.uk/child-maintenance-service"],["ctstudent","student","Student council tax exemption","Tax","https://www.gov.uk/council-tax/discounts-for-full-time-students"],["ctdisabled","disabled","Disabled band reduction","Tax","https://www.gov.uk/council-tax/discounts-for-disabled-people"],["student","student","Student finance","Education","https://www.gov.uk/student-finance"],["dsa","student","Disabled Students' Allowance","Education","https://www.gov.uk/disabled-students-allowance-dsa"],["bursary","student","16 to 19 Bursary Fund","Education","https://www.gov.uk/1619-bursary-fund"],["railcard","travel","Railcard discounts","Travel","https://www.railcard.co.uk/"],["buspass","older","Older person's bus pass","Travel","https://www.gov.uk/apply-for-elderly-person-bus-pass"],["disabledpass","disabled","Disabled person's bus pass","Travel","https://www.gov.uk/apply-for-disabled-bus-pass"],["ctf","young","Find a Child Trust Fund","Savings","https://www.gov.uk/child-trust-funds"],["ns","pension","Trace lost NS&I savings","Savings","https://www.nsandi.com/"],["bank","pension","Trace dormant bank accounts","Savings","https://www.mylostaccount.org.uk/"],["state","older","State Pension","Benefits","https://www.gov.uk/new-state-pension"]];

const data=original.map((d,i)=>({id:d[0],group:d[0],name:d[2],value:d[3],info:d[4],url:d[5],cat:categories[i]})).concat(extra.map(d=>({id:d[0],group:d[1],name:d[2],cat:d[3],url:d[4],value:'Check current eligibility',info:'Review the linked guidance for qualifying conditions, deadlines and application steps.'})));
const questions=Object.fromEntries(original.map(d=>[d[0],d[1]]));Object.assign(questions,{older:'I am approaching or above State Pension age',disabled:'I have a disability or long-term condition',job:'I have lost my job or am looking for work',baby:'I am expecting or recently had a child',bereaved:'I have experienced a bereavement',work:'I am or have recently been employed',young:'I am aged 18–39',purchase:'I have had a problem with a purchase',utility:'I have had utility service or billing problems',travel:'I travel or have experienced travel disruption',student:'I am a student'});
let s={answers:[],claims:{},hidden:[],profile:{}};try{s={...s,...JSON.parse(localStorage.getItem('claimit')||'{}')}}catch(e){}const save=()=>{try{localStorage.setItem('claimit',JSON.stringify(s))}catch(e){}};const $=id=>document.getElementById(id),screen=$('screen'),money=n=>Number(n||0).toLocaleString('en-GB',{style:'currency',currency:'GBP'});let mode='all';const visible=d=>!s.hidden.includes(d.id);const matches=()=>data.filter(d=>visible(d)&&s.answers.includes(d.group));const find=id=>data.find(d=>d.id===id);
function tile(d){return '<article><div class="tag">'+d.cat+'</div><h3>'+d.name+'</h3><b>'+d.value+'</b><p>'+d.info+'</p><a href="'+d.url+'" target="_blank" rel="noopener">Guidance ↗</a><p><button onclick="add(\''+d.id+'\')">Track</button><button class="secondary" onclick="letter(\''+d.id+'\')">Draft letter</button><button class="secondary" onclick="hide(\''+d.id+'\')">Hide</button></p></article>'}
function page(p){let received=Object.values(s.claims).reduce((a,c)=>a+(c.status==='Received'?Number(c.amount)||0:0),0);if(p==='home')screen.innerHTML='<div class="hero"><small>Money recovered</small><strong>'+money(received)+'</strong>Keep track of every claim</div><div class="stats"><article><small>Potential matches</small><h2>'+matches().length+'</h2></article><article><small>Tracked claims</small><h2>'+Object.keys(s.claims).length+'</h2></article></div><button onclick="page(\'check\')">Find my money</button><button class="secondary" onclick="page(\'discover\')">Browse '+data.length+' opportunities</button><h2>Your opportunities</h2>'+matches().slice(0,5).map(tile).join('')+'<button onclick="calc()">Savings calculator</button>';
if(p==='discover'){screen.innerHTML='<h2>Discover opportunities</h2><input id="search" placeholder="Search opportunities" oninput="filter()"><select id="cat" onchange="filter()"><option value="">All categories</option>'+[...new Set(data.map(d=>d.cat))].sort().map(c=>'<option>'+c+'</option>').join('')+'</select><select id="mode" onchange="filter()"><option value="all">All opportunities</option><option value="matched">My matches</option><option value="hidden">Hidden opportunities</option></select><div id="list"></div>';filter()}

function filter(){let q=$('search').value.toLowerCase(),c=$('cat').value,m=$('mode').value;let list=data.filter(d=>(m==='hidden'?!visible(d):visible(d))&&(!c||d.cat===c)&&d.name.toLowerCase().includes(q)&&(m!=='matched'||s.answers.includes(d.group)));$('list').innerHTML='<p>'+list.length+' opportunities</p>'+list.map(d=>m==='hidden'?'<article>'+d.name+' <button onclick="unhide(\''+d.id+'\')">Restore</button></article>':tile(d)).join('')}
function results(){s.answers=[...screen.querySelectorAll('input:checked')].map(x=>x.value);s.profile.nation=$('nation').value;save();page('results')}function add(id){s.claims[id]??={status:'To check',amount:0};save();page('tracker')}function amount(id,v){s.claims[id].amount=Math.max(0,Number(v)||0);save()}function status(id,v){s.claims[id].status=v;save();page('tracker')}function remove(id){delete s.claims[id];save();page('tracker')}function hide(id){if(!s.hidden.includes(id))s.hidden.push(id);save();page('discover')}function unhide(id){s.hidden=s.hidden.filter(x=>x!==id);save();filter()}
function calc(){screen.innerHTML='<h2>Savings calculators</h2><article><h3>Single person council tax discount</h3><p>Only if eligible for the 25% discount.</p><label>Annual bill before discount (£)<input id="bill" type="number" min="0" oninput="estimate()"></label><label><input id="eligible" type="checkbox" onchange="estimate()"> I am the only countable adult</label><h2 id="est">£0.00</h2></article><article><h3>Tax-Free Childcare top-up illustration</h3><label>Eligible amount you pay in (£ per quarter)<input id="childpay" type="number" min="0" oninput="estimate()"></label><p>Standard cap illustration, one eligible child; excludes higher disability cap.</p><h2 id="topup">£0.00</h2></article><button onclick="page(\'home\')">Back</button>'}
function estimate(){$('est').textContent=money($('eligible').checked?Math.max(0,Number($('bill').value)||0)*.25:0);$('topup').textContent=money(Math.min(500,Math.max(0,Number($('childpay').value)||0)*.25))}
function letter(id){let d=find(id);screen.innerHTML='<h2>Draft request: '+d.name+'</h2><p>Use the official application process where required. This is a general enquiry, not a completed claim.</p><label>Your name<input id="person"></label><label>Reference (optional)<input id="ref"></label><label>Relevant circumstances<textarea id="facts" rows="4"></textarea></label><button onclick="generate(\''+id+'\')">Generate draft</button><textarea id="draft" rows="12" aria-label="Draft letter"></textarea><button onclick="downloadDraft()">Download letter</button><button class="secondary" onclick="page(\'discover\')">Back</button>'}
function generate(id){$('draft').value=['Dear Sir or Madam,','','I am writing to enquire about '+find(id).name+'. Please confirm whether I may qualify and advise me of the appropriate application process.','', 'Reference: '+($('ref').value||'Not supplied'),'My circumstances: '+($('facts').value||'[Add relevant details]'),'','Please let me know what evidence is required and any applicable deadlines.','','Kind regards,',$('person').value||'[Your name]'].join('\n')}
function downloadDraft(){let u=URL.createObjectURL(new Blob([$('draft').value],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download='claimit-letter.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}page('home');</script></html>
