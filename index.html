<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClaimIt</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f7f5;color:#163c30;font:16px system-ui}header{background:#104b38;color:white;padding:24px}header b{font-size:32px}main{max-width:650px;margin:auto;padding:18px 18px 100px}article,label{display:block;background:white;padding:16px;border-radius:16px;margin:12px 0}button{border:0;border-radius:12px;padding:14px;background:#104b38;color:white;font:inherit;font-weight:bold;cursor:pointer}nav{position:fixed;bottom:0;background:white;width:100%;display:flex;justify-content:space-around;padding:12px}a{color:#08764c}input{font:inherit;max-width:100%}small{color:#64776c}h2{margin:8px 0}</style><header><b>ClaimIt.</b><div>Find money you could be entitled to.</div></header><main id="screen"></main><nav><button onclick="page('home')">Home</button><button onclick="page('check')">Check</button><button onclick="page('tracker')">Tracker</button></nav><script>
const data=[
['single','I live alone','Council tax discount','25% for eligible single-adult households','Check with your council.','https://www.gov.uk/apply-for-council-tax-discount'],
['child','I have children','Child Benefit','Weekly payments','Check eligibility and the high income tax charge.','https://www.gov.uk/child-benefit'],
['married','I am married or in a civil partnership','Marriage Allowance','Potential tax saving','Check both partners’ taxable income.','https://www.gov.uk/marriage-allowance'],
['low','My household has a low income','Benefits and council tax support','Varies','Use an independent benefits calculator.','https://www.gov.uk/benefits-calculators'],
['childcare','I pay for childcare','Tax-Free Childcare','Government top-ups','Check work and income conditions.','https://www.gov.uk/tax-free-childcare'],
['train','I experienced a train delay','Delay Repay','Varies by delay and operator','Keep your ticket and check the operator policy.','https://www.nationalrail.co.uk/help-and-assistance/compensation-and-refunds/'],
['flight','I experienced flight disruption','Flight compensation','Varies by route and disruption','Check the CAA eligibility guidance.','https://www.caa.co.uk/passengers-and-public/'],
['uniform','I pay to maintain a work uniform','Uniform tax relief','Varies','Check if your employer reimburses you.','https://www.gov.uk/tax-relief-for-employees/uniforms-work-clothing-and-tools'],
['pension','I have had previous employers','Lost pension tracing','Find forgotten pensions','Find contact details for old pension schemes.','https://www.gov.uk/find-pension-contact-details'],
['health','I need help with healthcare costs','Help with NHS costs','Varies by nation and eligibility','Check the relevant national scheme.','https://www.nhs.uk/nhs-services/help-with-health-costs/'],
['broadband','I experienced broadband service problems','Broadband compensation','Varies by provider','Check the automatic compensation scheme.','https://www.ofcom.org.uk/phones-and-broadband/service-quality/automatic-compensation-need-know/'],
['carer','I provide unpaid care','Carer support','Varies','Check the care hours and earnings conditions.','https://www.gov.uk/carers-allowance']];
let s={answers:[],claims:{}};try{s=JSON.parse(localStorage.getItem('claimit'))||s}catch(e){}const save=()=>{try{localStorage.setItem('claimit',JSON.stringify(s))}catch(e){}};const screen=document.getElementById('screen');const money=n=>n.toLocaleString('en-GB',{style:'currency',currency:'GBP'});function tile(d){return '<article><h2>'+d[2]+'</h2><b>'+d[3]+'</b><p>'+d[4]+'</p><p><a target="_blank" rel="noopener" href="'+d[5]+'">Official guidance</a></p><button onclick="add(\''+d[0]+'\')">Track opportunity</button></article>'}
function page(p){let matches=data.filter(d=>s.answers.includes(d[0]));let received=Object.values(s.claims).reduce((a,c)=>a+(c.status==='Received'?c.amount:0),0);if(p==='home')screen.innerHTML='<article style="background:#d9f4e5"><small>Money recovered</small><h1 style="font-size:40px">'+money(received)+'</h1>'+matches.length+' potential opportunities</article><h2>Your money, reclaimed.</h2><p>Discover refunds, discounts and financial support worth checking.</p><button onclick="page(\'check\')">Find my money</button><h2>Explore opportunities</h2>'+data.map(tile).join('');if(p==='check')screen.innerHTML='<h2>What applies to you?</h2>'+data.map(d=>'<label><input type="checkbox" value="'+d[0]+'" '+(s.answers.includes(d[0])?'checked':'')+'> '+d[1]+'</label>').join('')+'<button onclick="results()">Show results</button>';if(p==='results')screen.innerHTML='<h2>'+matches.length+' possible opportunities</h2><p>These are not confirmed entitlements.</p>'+matches.map(tile).join('')+'<button onclick="page(\'check\')">Update answers</button>';if(p==='tracker')screen.innerHTML='<h2>My claims</h2><article>Received: <b>'+money(received)+'</b></article>'+Object.entries(s.claims).map(([id,c])=>'<article><h2>'+data.find(d=>d[0]===id)[2]+'</h2><p>'+c.status+'</p><label>Amount (£) <input type="number" min="0" step=".01" value="'+c.amount+'" onchange="amount(\''+id+'\',this.value)"></label><button onclick="status(\''+id+'\',\'Submitted\')">Submitted</button> <button onclick="status(\''+id+'\',\'Received\')">Received</button><p><button onclick="remove(\''+id+'\')">Remove</button></p></article>').join('');screen.insertAdjacentHTML('beforeend','<p><small>Prototype: eligibility and amounts must be checked against current official guidance. Your answers are stored on this device only.</small></p>')}
function results(){s.answers=[...screen.querySelectorAll('input:checked')].map(x=>x.value);save();page('results')}function add(id){s.claims[id]??={status:'To check',amount:0};save();page('tracker')}function amount(id,v){s.claims[id].amount=Math.max(0,Number(v)||0);save();page('tracker')}function status(id,v){s.claims[id].status=v;save();page('tracker')}function remove(id){delete s.claims[id];save();page('tracker')}page('home');</script></html>
